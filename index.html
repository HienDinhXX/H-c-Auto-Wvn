<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Quản lý Thông số Sản xuất</title>
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thông số SX">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --primary: #007aff;
      --danger: #ff3b30;
      --success: #34c759;
      --warning: #ff9500;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --radius: 12px;
      --pad: 12px;
      --gap: 10px;
      --container-max: 100%;
    }

    *, *::before, *::after { box-sizing: border-box; }
    input, button, select, textarea { max-width: 100%; display: block; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding-top: 55px;
      padding-bottom: 30px;
      font-size: 12px;
    }

    /* Tab Bar */
    .tab-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      background: #e5e5ea;
      border-bottom: 1px solid #d1d1d6;
      display: flex;
      align-items: center;
      z-index: 99;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .tab-divider { width: 1px; height: 24px; background-color: #c7c7cc; }

    .tab-item {
      flex: 1; height: 100%; text-align: center; color: var(--muted);
      font-size: 11px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
      background: #e5e5ea; opacity: 0.7;
      transition: background 0.2s ease, opacity 0.2s ease, color 0.2s ease;
    }

    .tab-item.active {
      background: #ffffff; color: var(--primary);
      font-weight: 600; opacity: 1;
    }
    .tab-item .icon { font-size: 16px; }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 8px;
    }

    .card {
      background: var(--card);
      padding: var(--pad);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: var(--gap);
    }

    h2 { font-size: 14px; margin: 0 0 8px; }

    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 600; }

    input, select, button {
      width: 100%;
      min-height: 32px;
      font-size: 12px;
      border-radius: 6px;
    }

    input, select {
      padding: 4px 6px;
      margin-bottom: 8px;
      border: 1px solid #e3e3e8;
      background: #fafafa;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0,122,255,0.12);
    }

    button {
      padding: 4px 6px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .05s ease, background 0.2s;
    }
    button:active { transform: translateY(1px); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }

    .filter-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* Bảng Ma Trận Ngang */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #e5e5ea;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    table {
      border-collapse: collapse;
      font-size: 12px;
      background: #fff;
      min-width: 100%;
    }

    th, td {
      padding: 2px 3px;
      text-align: left;
      border-bottom: 1px solid #efeff4;
      border-right: 1px solid #efeff4;
      vertical-align: middle;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      background: #f8f8fa !important;
      font-weight: 600;
      color: var(--text);
      width: 85px;
      min-width: 85px;
      max-width: 85px;
      z-index: 2;
      box-shadow: 2px 0 4px rgba(0,0,0,0.04);
      font-size: 12px;
      padding-left: 4px;
      padding-right: 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .col-item {
      min-width: 160px;
      width: 160px;
    }

    .cell-header-fixed {
      background: #f0f8ff;
      color: #0051a8;
      font-weight: 700;
      text-align: center;
      padding: 6px;
      border-bottom: 2px solid #b8d8ff;
    }

    /* Ô NHẬP LIỆU */
    .cell-input {
      width: 100%;
      min-height: 26px;
      height: 26px;
      padding: 3px 5px;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.3;
      border: 1px solid #e3e3e8;
      border-radius: 4px;
      background: #fafafa;
      outline: none;
      resize: vertical;
      overflow-y: hidden;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cell-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0,122,255,0.15);
    }

    .cell-input-header {
      font-weight: 600;
      background: #f0f8ff;
      border-color: #b8d8ff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .action-btn {
      width: 100%;
      min-height: unset;
      padding: 3px 4px;
      font-size: 11px;
    }

    .btn-insert {
      background: #e5f1ff;
      color: var(--primary);
      border: 1px dashed var(--primary);
      margin-bottom: 2px;
    }

    .list-item-manage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #efeff4;
    }

    .flex-row {
      display: flex;
      gap: 6px;
    }

    /* Thống kê Model theo Line */
    .stat-line-block {
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    .stat-line-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .stat-model-tag {
      display: inline-block;
      background: #e5f1ff;
      color: #0051a8;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin: 2px 4px 2px 0;
      font-weight: 500;
    }
    .badge-count {
      font-size: 10px;
      background: var(--primary);
      color: #fff;
      padding: 1px 5px;
      border-radius: 8px;
      margin-left: 3px;
    }
    
    /* Phân biệt nhóm ốc 1 và ốc 2 trong Tab Học tự động */
.auto-group-1 td {
  background: #f0fff4;
}

.auto-group-1 .sticky-col {
  background: #e5f9ec !important;
}

.auto-group-2 td {
  background: #fffbea;
}

.auto-group-2 .sticky-col {
  background: #fff6d9 !important;
}

    
  </style>
</head>
<body>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('auto', this)">
      <span class="icon">🤖</span>
      <span>Học tự động</span>
    </div>
    <div class="tab-divider"></div>
    <div class="tab-item" onclick="switchTab('jig', this)">
      <span class="icon">🔧</span>
      <span>Học đồ gá</span>
    </div>
    <div class="tab-divider"></div>
    <div class="tab-item" onclick="switchTab('settings', this)">
      <span class="icon">⚙️</span>
      <span>Cài đặt</span>
    </div>
  </div>

  <div class="container">

    <!-- TAB 1: HỌC TỰ ĐỘNG -->
    <div id="tab-auto" class="tab-content active">
      <div class="card">
        <h2>🤖 Thông số Học tự động</h2>
        <div class="filter-group">
          <div>
            <label for="autoLineSelect">Chọn Line</label>
            <select id="autoLineSelect" onchange="renderAutoMatrix()"></select>
          </div>
          <div>
            <label for="autoModelSelect">Chọn Model</label>
            <select id="autoModelSelect" onchange="renderAutoMatrix()"></select>
          </div>
        </div>

        <div class="table-wrapper">
          <table id="autoMatrixTable">
            <tbody id="autoMatrixBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: HỌC ĐỒ GÁ -->
    <div id="tab-jig" class="tab-content">
      <div class="card">
        <h2>🔧 Thông số Học đồ gá</h2>
        <div class="filter-group">
          <div>
            <label for="jigLineSelect">Chọn Line</label>
            <select id="jigLineSelect" onchange="renderJigMatrix()"></select>
          </div>
          <div>
            <label for="jigModelSelect">Chọn Model</label>
            <select id="jigModelSelect" onchange="renderJigMatrix()"></select>
          </div>
        </div>

        <button class="btn-primary" onclick="addJigCol()" style="margin-bottom: 8px; height: 30px;">+ Thêm trạm cuối</button>

        <div class="table-wrapper">
          <table id="jigMatrixTable">
            <tbody id="jigMatrixBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 3: CÀI ĐẶT -->
    <div id="tab-settings" class="tab-content">

      <!-- MỤC THỐNG KÊ MODEL THEO LINE -->
      <div class="card">
        <h2>📋 Thống kê Dữ liệu đã ghi theo Line</h2>
        <div id="lineSummaryContainer"></div>
      </div>

      <!-- CÀI ĐẶT TÊN MÁY CỐ ĐỊNH THEO LINE -->
      <div class="card">
        <h2>🤖 Cài đặt Tên máy cố định theo Line</h2>
        <label for="settingLineSelect">Chọn Line để thiết lập danh sách máy</label>
        <select id="settingLineSelect" onchange="renderLineMachinesSetting()"></select>
        
        <div id="lineMachinesListContainer" style="margin-top: 8px;"></div>
        
        <div class="flex-row" style="margin-top: 8px;">
          <input type="text" id="newMachineInput" placeholder="Tên máy mới (ví dụ: Máy 1, Máy Bán Ốc...)..." style="margin-bottom:0;">
          <button class="btn-primary" onclick="addNewMachineToLine()" style="width: auto; white-space: nowrap;">+ Thêm máy</button>
        </div>
      </div>

      <div class="card">
        <h2>📍 Quản lý Danh sách Line</h2>
        <div id="linesListContainer"></div>
        <div class="flex-row" style="margin-top: 8px;">
          <input type="text" id="newLineInput" placeholder="Tên Line mới (ví dụ: A6A)..." style="margin-bottom:0;">
          <button class="btn-primary" onclick="addNewLine()" style="width: auto; white-space: nowrap;">Thêm Line</button>
        </div>
      </div>

      <div class="card">
        <h2>📱 Quản lý Danh sách Model</h2>
        <div id="modelsListContainer"></div>
        <div class="flex-row" style="margin-top: 8px;">
          <input type="text" id="newModelInput" placeholder="Tên Model mới..." style="margin-bottom:0;">
          <button class="btn-primary" onclick="addNewModel()" style="width: auto; white-space: nowrap;">Thêm Model</button>
        </div>
      </div>

      <div class="card">
        <h2>🗂️ Sao lưu & Phục hồi dữ liệu</h2>
        <button class="btn-primary" onclick="exportData()" style="margin-bottom:8px;">📤 Xuất dữ liệu (.json)</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn-success" onclick="document.getElementById('importFile').click()" style="margin-bottom:8px;">📥 Phục hồi dữ liệu</button>
        <button class="btn-danger" onclick="resetToDefaults()">🔄 Tải lại dữ liệu mặc định</button>
      </div>
    </div>

  </div>

  <script>
    // Danh sách Line mặc định (bao gồm cả A1A)
    const DEFAULT_LINES = ["A1A", "A1B", "A2A", "A2B", "A3A", "A3B", "A4A", "A4B", "A5A", "A5B"];
    
    // Mặc định danh sách Model trống
    const DEFAULT_MODELS = [];

    // Mặc định tất cả các Line KHÔNG CÓ MÁY NÀO
    const DEFAULT_LINE_MACHINES = {
      "A1A": [],
      "A3A": [],
      "A3B": [],
      "A4A": [],
      "A4B": [],
      "A5A": [],
      "A5B": []
    };

    let lines = [];
    let models = [];
    let lineMachines = {};
    let autoData = [];
    let jigData = [];

    function loadData() {
      lines = JSON.parse(localStorage.getItem("app_lines")) || DEFAULT_LINES;
      models = JSON.parse(localStorage.getItem("app_models")) || DEFAULT_MODELS;
      lineMachines = JSON.parse(localStorage.getItem("app_line_machines")) || DEFAULT_LINE_MACHINES;
      autoData = JSON.parse(localStorage.getItem("app_auto_data")) || [];
      jigData = JSON.parse(localStorage.getItem("app_jig_data")) || [];

      lines.forEach(l => {
        if (!lineMachines[l]) lineMachines[l] = [];
      });

      updateSelectOptions();
    }

    function saveData() {
      localStorage.setItem("app_lines", JSON.stringify(lines));
      localStorage.setItem("app_models", JSON.stringify(models));
      localStorage.setItem("app_line_machines", JSON.stringify(lineMachines));
      localStorage.setItem("app_auto_data", JSON.stringify(autoData));
      localStorage.setItem("app_jig_data", JSON.stringify(jigData));
    }

    function resetToDefaults() {
      if (confirm("Thao tác này sẽ đặt lại ứng dụng: Tất cả các Line sẽ KHÔNG CÓ máy nào và CHƯA CÓ dữ liệu Model nào. Bạn có chắc không?")) {
        lines = DEFAULT_LINES;
        models = DEFAULT_MODELS;
        lineMachines = {
          "A1A": [], "A1B": [], "A2A": [], "A2B": [],  "A3A": [], "A3B": [], "A4A": [], "A4B": [], "A5A": [], "A5B": []
        };
        autoData = [];
        jigData = [];
        saveData();
        updateSelectOptions();
        renderSettings();
        renderAutoMatrix();
        renderJigMatrix();
        alert("Đã xóa toàn bộ dữ liệu và đặt lại trạng thái mặc định!");
      }
    }

    function updateSelectOptions() {
      const lineOptions = lines.length 
        ? lines.map(l => `<option value="${l}">${l}</option>`).join('') 
        : '<option value="">-- Chưa có Line --</option>';

      const modelOptions = models.length 
        ? models.map(m => `<option value="${m}">${m}</option>`).join('') 
        : '<option value="">-- Chưa có Model --</option>';

      document.getElementById('autoLineSelect').innerHTML = lineOptions;
      document.getElementById('autoModelSelect').innerHTML = modelOptions;
      document.getElementById('jigLineSelect').innerHTML = lineOptions;
      document.getElementById('jigModelSelect').innerHTML = modelOptions;
      document.getElementById('settingLineSelect').innerHTML = lineOptions;
    }

    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(ti => ti.classList.remove('active'));

      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');

      if (tabName === 'auto') renderAutoMatrix();
      else if (tabName === 'jig') renderJigMatrix();
      else if (tabName === 'settings') renderSettings();
    }

    function autoResizeTextarea(el) {
      el.style.height = '26px';
      if (el.scrollHeight > 26) {
        el.style.height = (el.scrollHeight) + 'px';
      }
    }

    /* ===== TAB 1: HỌC TỰ ĐỘNG ===== */
    const AUTO_FIELDS = [
      { key: 'congDung', label: 'Công dụng' },
      { key: 'maOc1', label: 'Mã ốc hộp 1' },
      { key: 'soOc1', label: 'Số ốc 1 bắn' },
      { key: 'lucVit1', label: 'Lực vít 1' },
      { key: 'maOc2', label: 'Mã ốc hộp 2' },
      { key: 'soOc2', label: 'Số ốc 2 bắn' },
      { key: 'lucVit2', label: 'Lực vít 2' },
      { key: 'ghiChu', label: 'Ghi chú' }
    ];

    function renderAutoMatrix() {
      const selectedLine = document.getElementById('autoLineSelect').value;
      const selectedModel = document.getElementById('autoModelSelect').value;
      const tbody = document.getElementById('autoMatrixBody');

      if (!selectedLine) {
        tbody.innerHTML = '<tr><td style="padding:15px; text-align:center; color: var(--muted);">Chưa chọn Line nào.</td></tr>';
        return;
      }

      if (!selectedModel) {
        tbody.innerHTML = `<tr><td style="padding:15px; text-align:center; color: var(--muted);">
          Chưa có Model nào.<br>
          Vui lòng vào <b>Tab Cài đặt</b> ➔ Mục <b>"Quản lý Danh sách Model"</b> để thêm Model mới.
        </td></tr>`;
        return;
      }

      const machinesList = lineMachines[selectedLine] || [];

      if (machinesList.length === 0) {
        tbody.innerHTML = `<tr><td style="padding:15px; text-align:center; color: var(--muted);">
          Line <b>${selectedLine}</b> hiện chưa có máy nào.<br>
          Vui lòng vào <b>Tab Cài đặt</b> ➔ Mục <b>"Cài đặt Tên máy cố định theo Line"</b> để thêm máy.
        </td></tr>`;
        return;
      }

      let html = '';

      // Hàng Tiêu Đề Cố Định Tên Máy
      html += `<tr>`;
      html += `<td class="sticky-col">Máy</td>`;
      machinesList.forEach(mName => {
        html += `<td class="col-item cell-header-fixed">${mName}</td>`;
      });
      html += `</tr>`;

      // Các hàng thông số
      AUTO_FIELDS.forEach(field => {
        
        let rowClass = '';

        if (['maOc1', 'soOc1', 'lucVit1'].includes(field.key)) {
        rowClass = 'auto-group-1';
         } else if (['maOc2', 'soOc2', 'lucVit2'].includes(field.key)) {
        rowClass = 'auto-group-2';
         }
        html += `<tr class="${rowClass}">`;
        
        
        html += `<td class="sticky-col">${field.label}</td>`;
        machinesList.forEach(mName => {
          const item = autoData.find(d => d.line === selectedLine && d.model === selectedModel && d.may === mName);
          const val = item ? (item[field.key] || '') : '';
          
          html += `<td class="col-item">
            <textarea class="cell-input" oninput="autoResizeTextarea(this)" onchange="updateAutoValue('${selectedLine}', '${selectedModel}', '${mName}', '${field.key}', this.value)">${val}</textarea>
          </td>`;
        });
        html += `</tr>`;
      });

      tbody.innerHTML = html;

      setTimeout(() => {
        document.querySelectorAll('#autoMatrixTable .cell-input').forEach(el => autoResizeTextarea(el));
      }, 0);
    }

    function updateAutoValue(line, model, may, field, value) {
      let item = autoData.find(d => d.line === line && d.model === model && d.may === may);
      if (!item) {
        item = { id: Date.now(), line, model, may };
        autoData.push(item);
      }
      item[field] = value;
      saveData();
    }

    /* ===== TAB 2: HỌC ĐỒ GÁ ===== */
    const JIG_FIELDS = [
      { key: 'tram', label: 'Trạm', isHeader: true },
      { key: 'tenDoGa', label: 'Tên đồ gá' },
      { key: 'thongSo', label: 'Thông số' },
      { key: 'ghiChu', label: 'Ghi chú' }
    ];

    function renderJigMatrix() {
      const selectedLine = document.getElementById('jigLineSelect').value;
      const selectedModel = document.getElementById('jigModelSelect').value;
      const tbody = document.getElementById('jigMatrixBody');

      if (!selectedLine || !selectedModel) {
        tbody.innerHTML = '<tr><td style="padding:15px; text-align:center; color: var(--muted);">Vui lòng chọn Line và Model (hoặc thêm Model trong Cài đặt).</td></tr>';
        return;
      }

      const filteredData = jigData.filter(d => d.line === selectedLine && d.model === selectedModel);

      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td style="padding:15px; text-align:center; color: var(--muted);">Chưa có trạm nào. Nhấn nút "+ Thêm trạm cuối" phía trên.</td></tr>';
        return;
      }

      let html = '';

      JIG_FIELDS.forEach(field => {
        html += `<tr>`;
        html += `<td class="sticky-col">${field.label}</td>`;
        filteredData.forEach(item => {
          const inputClass = field.isHeader ? 'cell-input cell-input-header' : 'cell-input';
          const placeholder = field.isHeader ? 'Tên trạm...' : '';
          html += `<td class="col-item">
            <textarea class="${inputClass}" placeholder="${placeholder}" oninput="autoResizeTextarea(this)" onchange="updateJigItem(${item.id}, '${field.key}', this.value)">${item[field.key] || ''}</textarea>
          </td>`;
        });
        html += `</tr>`;
      });

      html += `<tr>`;
      html += `<td class="sticky-col">Thao tác</td>`;
      filteredData.forEach(item => {
        html += `<td class="col-item">
          <button class="action-btn btn-insert" onclick="insertJigColBefore(${item.id})">➕ Chèn trạm trước</button>
          <button class="btn-danger action-btn" onclick="deleteJigItem(${item.id})">🗑️ Xóa trạm</button>
        </td>`;
      });
      html += `</tr>`;

      tbody.innerHTML = html;

      setTimeout(() => {
        document.querySelectorAll('#jigMatrixTable .cell-input').forEach(el => autoResizeTextarea(el));
      }, 0);
    }

    function addJigCol() {
      const line = document.getElementById('jigLineSelect').value;
      const model = document.getElementById('jigModelSelect').value;
      if (!line || !model) { alert("Vui lòng chọn Line và Model trước khi thêm!"); return; }

      jigData.push({
        id: Date.now(), line, model,
        tram: 'Trạm ' + (jigData.filter(d => d.line === line && d.model === model).length + 1),
        tenDoGa: '', thongSo: '', ghiChu: ''
      });
      saveData();
      renderJigMatrix();
    }

    function insertJigColBefore(targetId) {
      const targetIndex = jigData.findIndex(d => d.id === targetId);
      if (targetIndex === -1) return;

      const targetItem = jigData[targetIndex];
      const newItem = {
        id: Date.now(),
        line: targetItem.line,
        model: targetItem.model,
        tram: 'Trạm mới',
        tenDoGa: '', thongSo: '', ghiChu: ''
      };

      jigData.splice(targetIndex, 0, newItem);
      saveData();
      renderJigMatrix();
    }

    function updateJigItem(id, field, value) {
      const item = jigData.find(d => d.id === id);
      if (item) {
        item[field] = value;
        saveData();
      }
    }

    function deleteJigItem(id) {
      if (confirm("Xóa trạm này?")) {
        jigData = jigData.filter(d => d.id !== id);
        saveData();
        renderJigMatrix();
      }
    }

    /* ===== TAB 3: CÀI ĐẶT ===== */
    function renderSettings() {
      renderLineMachinesSetting();

      const linesContainer = document.getElementById('linesListContainer');
      if (lines.length === 0) {
        linesContainer.innerHTML = '<div style="color:var(--muted); font-style:italic;">Chưa có Line nào.</div>';
      } else {
        linesContainer.innerHTML = lines.map((l, index) => `
          <div class="list-item-manage">
            <span><b>Line:</b> ${l}</span>
            <div class="flex-row">
              <button class="btn-warning action-btn" style="width:auto;" onclick="editLine(${index})">✏️ Sửa</button>
              <button class="btn-danger action-btn" style="width:auto;" onclick="deleteLine(${index})">🗑️ Xóa</button>
            </div>
          </div>
        `).join('');
      }

      const modelsContainer = document.getElementById('modelsListContainer');
      if (models.length === 0) {
        modelsContainer.innerHTML = '<div style="color:var(--muted); font-style:italic;">Chưa có Model nào được thêm.</div>';
      } else {
        modelsContainer.innerHTML = models.map((m, index) => `
          <div class="list-item-manage">
            <span><b>Model:</b> ${m}</span>
            <div class="flex-row">
              <button class="btn-warning action-btn" style="width:auto;" onclick="editModel(${index})">✏️ Sửa</button>
              <button class="btn-danger action-btn" style="width:auto;" onclick="deleteModel(${index})">🗑️ Xóa</button>
            </div>
          </div>
        `).join('');
      }

      renderSummary();
    }

    /* --- CÀI ĐẶT DANH SÁCH MÁY CỐ ĐỊNH THEO LINE --- */
    function renderLineMachinesSetting() {
      const line = document.getElementById('settingLineSelect').value;
      const container = document.getElementById('lineMachinesListContainer');
      if (!line) { container.innerHTML = ''; return; }

      const mList = lineMachines[line] || [];

      if (mList.length === 0) {
        container.innerHTML = `<div style="color:var(--muted); font-style:italic;">Chưa có máy nào được thêm vào Line ${line}.</div>`;
        return;
      }

      container.innerHTML = mList.map((mName, index) => `
        <div class="list-item-manage">
          <span><b>Máy ${index + 1}:</b> ${mName}</span>
          <div class="flex-row">
            <button class="btn-warning action-btn" style="width:auto;" onclick="editMachineInLine('${line}', ${index})">✏️ Sửa</button>
            <button class="btn-danger action-btn" style="width:auto;" onclick="deleteMachineInLine('${line}', ${index})">🗑️ Xóa</button>
          </div>
        </div>
      `).join('');
    }

    function addNewMachineToLine() {
      const line = document.getElementById('settingLineSelect').value;
      const input = document.getElementById('newMachineInput');
      const val = input.value.trim();

      if (!line) { alert("Vui lòng chọn Line!"); return; }
      if (!val) return;
      
      if (!lineMachines[line]) lineMachines[line] = [];

      if (lineMachines[line].includes(val)) {
        alert("Tên máy này đã có trong Line!");
        return;
      }

      lineMachines[line].push(val);
      input.value = '';
      saveData();
      renderLineMachinesSetting();
    }

    function editMachineInLine(line, index) {
      const oldName = lineMachines[line][index];
      const newName = prompt(`Nhập tên mới cho máy "${oldName}":`, oldName);

      if (newName && newName.trim() !== "" && newName !== oldName) {
        const trimmed = newName.trim();
        if (lineMachines[line].includes(trimmed)) {
          alert("Tên máy này đã bị trùng trong Line!");
          return;
        }

        lineMachines[line][index] = trimmed;

        autoData.forEach(d => {
          if (d.line === line && d.may === oldName) {
            d.may = trimmed;
          }
        });

        saveData();
        renderLineMachinesSetting();
      }
    }

    function deleteMachineInLine(line, index) {
      const mName = lineMachines[line][index];
      if (confirm(`Xóa máy "${mName}" khỏi Line ${line}?`)) {
        lineMachines[line].splice(index, 1);
        saveData();
        renderLineMachinesSetting();
      }
    }

    /* --- HIỂN THỊ LIỆT KÊ MODEL ĐÃ GHI THEO LINE --- */
    function renderSummary() {
      const summaryContainer = document.getElementById('lineSummaryContainer');
      let html = '';

      if (lines.length === 0) {
        summaryContainer.innerHTML = '<div style="color: var(--muted); font-style: italic;">Chưa có Line nào.</div>';
        return;
      }

      lines.forEach(line => {
        const autoModels = autoData.filter(d => d.line === line && Object.keys(d).some(k => !['id','line','model','may'].includes(k) && d[k] !== ''));
        const jigModels = jigData.filter(d => d.line === line);

        const modelStats = {};

        autoModels.forEach(item => {
          if (!modelStats[item.model]) modelStats[item.model] = { hasAuto: true, jigCount: 0 };
          else modelStats[item.model].hasAuto = true;
        });

        jigModels.forEach(item => {
          if (!modelStats[item.model]) modelStats[item.model] = { hasAuto: false, jigCount: 0 };
          modelStats[item.model].jigCount++;
        });

        const recordedModels = Object.keys(modelStats);

        html += `<div class="stat-line-block">`;
        html += `<div class="stat-line-title">📍 Line: ${line}</div>`;

        if (recordedModels.length === 0) {
          html += `<div style="color: var(--muted); font-style: italic;">Chưa có dữ liệu thông số nào được ghi.</div>`;
        } else {
          recordedModels.forEach(modelName => {
            const stat = modelStats[modelName];
            let details = [];
            if (stat.hasAuto) details.push(`Tự động`);
            if (stat.jigCount > 0) details.push(`${stat.jigCount} trạm đồ gá`);

            html += `<span class="stat-model-tag">📱 ${modelName} <span class="badge-count">${details.join(' + ')}</span></span>`;
          });
        }
        html += `</div>`;
      });

      summaryContainer.innerHTML = html;
    }

    /* --- CÁC THAO TÁC SỬA / XÓA LINE & MODEL --- */
    function addNewLine() {
      const val = document.getElementById('newLineInput').value.trim();
      if (!val) return;
      if (lines.includes(val)) { alert("Line này đã tồn tại!"); return; }

      lines.push(val);
      lineMachines[val] = [];
      document.getElementById('newLineInput').value = '';
      saveData();
      updateSelectOptions();
      renderSettings();
    }

    function editLine(index) {
      const oldName = lines[index];
      const newName = prompt(`Nhập tên mới cho Line "${oldName}":`, oldName);
      if (newName && newName.trim() !== "" && newName !== oldName) {
        const trimmed = newName.trim();
        if (lines.includes(trimmed)) { alert("Tên Line này đã trùng với Line khác!"); return; }

        lines[index] = trimmed;
        lineMachines[trimmed] = lineMachines[oldName] || [];
        delete lineMachines[oldName];

        autoData.forEach(d => { if (d.line === oldName) d.line = trimmed; });
        jigData.forEach(d => { if (d.line === oldName) d.line = trimmed; });

        saveData();
        updateSelectOptions();
        renderSettings();
      }
    }

    function deleteLine(index) {
      const lName = lines[index];
      if (confirm(`Xóa Line "${lName}"?`)) {
        lines.splice(index, 1);
        delete lineMachines[lName];
        saveData();
        updateSelectOptions();
        renderSettings();
      }
    }

    function addNewModel() {
      const val = document.getElementById('newModelInput').value.trim();
      if (!val) return;
      if (models.includes(val)) { alert("Model này đã tồn tại!"); return; }

      models.push(val);
      document.getElementById('newModelInput').value = '';
      saveData();
      updateSelectOptions();
      renderSettings();
    }

    function editModel(index) {
      const oldName = models[index];
      const newName = prompt(`Nhập tên mới cho Model "${oldName}":`, oldName);
      if (newName && newName.trim() !== "" && newName !== oldName) {
        const trimmed = newName.trim();
        if (models.includes(trimmed)) { alert("Tên Model này đã trùng với Model khác!"); return; }

        models[index] = trimmed;

        autoData.forEach(d => { if (d.model === oldName) d.model = trimmed; });
        jigData.forEach(d => { if (d.model === oldName) d.model = trimmed; });

        saveData();
        updateSelectOptions();
        renderSettings();
      }
    }

    function deleteModel(index) {
      if (confirm(`Xóa Model "${models[index]}"?`)) {
        models.splice(index, 1);
        saveData();
        updateSelectOptions();
        renderSettings();
      }
    }

    /* ===== XUẤT / NHẬP DỮ LIỆU ===== */
    function exportData() {
      const fullData = { lines, models, lineMachines, autoData, jigData };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Data_ThongSo_SX_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.lines) lines = parsed.lines;
          if (parsed.models) models = parsed.models;
          if (parsed.lineMachines) lineMachines = parsed.lineMachines;
          if (parsed.autoData) autoData = parsed.autoData;
          if (parsed.jigData) jigData = parsed.jigData;

          saveData();
          updateSelectOptions();
          alert("Phục hồi dữ liệu thành công!");
          location.reload();
        } catch (err) {
          alert("Lỗi file không hợp lệ!");
        }
      };
      reader.readAsText(file);
    }

    window.onload = function() {
      loadData();
      renderAutoMatrix();
    };
  </script>
</body>
</html>
