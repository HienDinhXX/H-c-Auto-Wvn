<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Quản lý Thông số Sản xuất</title>
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thông số SX">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --primary: #007aff;
      --danger: #ff3b30;
      --success: #34c759;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --radius: 12px;
      --pad: 12px;
      --gap: 10px;
      --container-max: 100%;
    }

    *, *::before, *::after { box-sizing: border-box; }
    input, button, select, textarea { max-width: 100%; display: block; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding-top: 55px;
      padding-bottom: 30px;
      font-size: 13px;
    }

    /* Tab Bar */
    .tab-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      background: #e5e5ea;
      border-bottom: 1px solid #d1d1d6;
      display: flex;
      align-items: center;
      z-index: 99;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .tab-divider { width: 1px; height: 24px; background-color: #c7c7cc; }

    .tab-item {
      flex: 1; height: 100%; text-align: center; color: var(--muted);
      font-size: 11px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
      background: #e5e5ea; opacity: 0.7;
      transition: background 0.2s ease, opacity 0.2s ease, color 0.2s ease;
    }

    .tab-item.active {
      background: #ffffff; color: var(--primary);
      font-weight: 600; opacity: 1;
    }
    .tab-item .icon { font-size: 16px; }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 10px;
    }

    .card {
      background: var(--card);
      padding: var(--pad);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: var(--gap);
    }

    h2 { font-size: 15px; margin: 0 0 8px; }

    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 600; }

    input, select, button {
      width: 100%;
      min-height: 34px;
      font-size: 12px;
      border-radius: 6px;
    }

    input, select {
      padding: 4px 8px;
      margin-bottom: 8px;
      border: 1px solid #e3e3e8;
      background: #fafafa;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0,122,255,0.12);
    }

    button {
      padding: 4px 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .05s ease, background 0.2s;
    }
    button:active { transform: translateY(1px); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    .filter-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* Bảng Ma Trận Ngang */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #e5e5ea;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    table {
      border-collapse: collapse;
      font-size: 12px;
      background: #fff;
      min-width: 100%;
    }

    th, td {
      padding: 3px 4px;
      text-align: left;
      border-bottom: 1px solid #efeff4;
      border-right: 1px solid #efeff4;
      vertical-align: middle;
    }

    /* Cột Tiêu đề bên trái: Chiều rộng bằng "Mã ốc hộp 2" (~120px) */
    .sticky-col {
      position: sticky;
      left: 0;
      background: #f8f8fa !important;
      font-weight: 600;
      color: var(--text);
      width: 120px;
      min-width: 120px;
      max-width: 120px;
      z-index: 2;
      box-shadow: 2px 0 4px rgba(0,0,0,0.04);
      font-size: 12px;
      padding-left: 6px;
    }

    .col-item {
      min-width: 170px;
      width: 170px;
    }

    /* Ô NHẬP LIỆU: Mặc định 1 dòng (28px), tự nở ra dòng 2 khi gõ dài */
    .cell-input {
      width: 100%;
      min-height: 28px;
      height: 28px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.3;
      border: 1px solid #e3e3e8;
      border-radius: 4px;
      background: #fafafa;
      outline: none;
      resize: vertical;
      overflow-y: hidden;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cell-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0,122,255,0.15);
    }

    .cell-input-header {
      font-weight: 600;
      background: #f0f8ff;
      border-color: #b8d8ff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .action-btn {
      width: 100%;
      min-height: unset;
      padding: 3px 6px;
      font-size: 11px;
    }

    .btn-insert {
      background: #e5f1ff;
      color: var(--primary);
      border: 1px dashed var(--primary);
      margin-bottom: 2px;
    }

    .list-item-manage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #efeff4;
    }

    .flex-row {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('auto', this)">
      <span class="icon">🤖</span>
      <span>Học tự động</span>
    </div>
    <div class="tab-divider"></div>
    <div class="tab-item" onclick="switchTab('jig', this)">
      <span class="icon">🔧</span>
      <span>Học đồ gá</span>
    </div>
    <div class="tab-divider"></div>
    <div class="tab-item" onclick="switchTab('settings', this)">
      <span class="icon">⚙️</span>
      <span>Cài đặt</span>
    </div>
  </div>

  <div class="container">

    <!-- TAB 1: HỌC TỰ ĐỘNG -->
    <div id="tab-auto" class="tab-content active">
      <div class="card">
        <h2>🤖 Thông số Học tự động</h2>
        <div class="filter-group">
          <div>
            <label for="autoLineSelect">Chọn Line</label>
            <select id="autoLineSelect" onchange="renderAutoMatrix()"></select>
          </div>
          <div>
            <label for="autoModelSelect">Chọn Model</label>
            <select id="autoModelSelect" onchange="renderAutoMatrix()"></select>
          </div>
        </div>

        <button class="btn-primary" onclick="addAutoCol()" style="margin-bottom: 8px; height: 32px;">+ Thêm máy cuối</button>

        <div class="table-wrapper">
          <table id="autoMatrixTable">
            <tbody id="autoMatrixBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: HỌC ĐỒ GÁ -->
    <div id="tab-jig" class="tab-content">
      <div class="card">
        <h2>🔧 Thông số Học đồ gá</h2>
        <div class="filter-group">
          <div>
            <label for="jigLineSelect">Chọn Line</label>
            <select id="jigLineSelect" onchange="renderJigMatrix()"></select>
          </div>
          <div>
            <label for="jigModelSelect">Chọn Model</label>
            <select id="jigModelSelect" onchange="renderJigMatrix()"></select>
          </div>
        </div>

        <button class="btn-primary" onclick="addJigCol()" style="margin-bottom: 8px; height: 32px;">+ Thêm trạm cuối</button>

        <div class="table-wrapper">
          <table id="jigMatrixTable">
            <tbody id="jigMatrixBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 3: CÀI ĐẶT -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h2>📍 Quản lý Danh sách Line</h2>
        <div id="linesListContainer"></div>
        <div class="flex-row" style="margin-top: 8px;">
          <input type="text" id="newLineInput" placeholder="Tên Line mới (ví dụ: A3A)..." style="margin-bottom:0;">
          <button class="btn-primary" onclick="addNewLine()" style="width: auto; white-space: nowrap;">Thêm Line</button>
        </div>
      </div>

      <div class="card">
        <h2>📱 Quản lý Danh sách Model</h2>
        <div id="modelsListContainer"></div>
        <div class="flex-row" style="margin-top: 8px;">
          <input type="text" id="newModelInput" placeholder="Tên Model mới..." style="margin-bottom:0;">
          <button class="btn-primary" onclick="addNewModel()" style="width: auto; white-space: nowrap;">Thêm Model</button>
        </div>
      </div>

      <div class="card">
        <h2>🗂️ Sao lưu & Phục hồi dữ liệu</h2>
        <button class="btn-primary" onclick="exportData()" style="margin-bottom:8px;">📤 Xuất dữ liệu (.json)</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn-success" onclick="document.getElementById('importFile').click()">📥 Phục hồi dữ liệu</button>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_LINES = ["A1A", "A1B", "A2A", "A2B"];
    const DEFAULT_MODELS = ["Slate 16", "Congo 16", "Taroko 16"];

    let lines = [];
    let models = [];
    let autoData = [];
    let jigData = [];

    function loadData() {
      lines = JSON.parse(localStorage.getItem("app_lines")) || DEFAULT_LINES;
      models = JSON.parse(localStorage.getItem("app_models")) || DEFAULT_MODELS;
      autoData = JSON.parse(localStorage.getItem("app_auto_data")) || [];
      jigData = JSON.parse(localStorage.getItem("app_jig_data")) || [];

      updateSelectOptions();
    }

    function saveData() {
      localStorage.setItem("app_lines", JSON.stringify(lines));
      localStorage.setItem("app_models", JSON.stringify(models));
      localStorage.setItem("app_auto_data", JSON.stringify(autoData));
      localStorage.setItem("app_jig_data", JSON.stringify(jigData));
    }

    function updateSelectOptions() {
      const lineOptions = lines.map(l => `<option value="${l}">${l}</option>`).join('');
      const modelOptions = models.map(m => `<option value="${m}">${m}</option>`).join('');

      document.getElementById('autoLineSelect').innerHTML = lineOptions;
      document.getElementById('autoModelSelect').innerHTML = modelOptions;
      document.getElementById('jigLineSelect').innerHTML = lineOptions;
      document.getElementById('jigModelSelect').innerHTML = modelOptions;
    }

    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(ti => ti.classList.remove('active'));

      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');

      if (tabName === 'auto') renderAutoMatrix();
      else if (tabName === 'jig') renderJigMatrix();
      else if (tabName === 'settings') renderSettings();
    }

    function autoResizeTextarea(el) {
      el.style.height = '28px'; // Trở về 1 dòng mặc định
      if (el.scrollHeight > 28) {
        el.style.height = (el.scrollHeight) + 'px'; // Mở rộng nếu tràn dòng
      }
    }

    /* ===== TAB 1: HỌC TỰ ĐỘNG ===== */
    const AUTO_FIELDS = [
      { key: 'may', label: 'Máy', isHeader: true },
      { key: 'congDung', label: 'Công dụng' },
      { key: 'maOc1', label: 'Mã ốc hộp 1' },
      { key: 'soOc1', label: 'Số ốc 1 bắn' },
      { key: 'lucVit1', label: 'Lực vít 1' },
      { key: 'maOc2', label: 'Mã ốc hộp 2' },
      { key: 'soOc2', label: 'Số ốc 2 bắn' },
      { key: 'lucVit2', label: 'Lực vít 2' },
      { key: 'ghiChu', label: 'Ghi chú' }
    ];

    function renderAutoMatrix() {
      const selectedLine = document.getElementById('autoLineSelect').value;
      const selectedModel = document.getElementById('autoModelSelect').value;
      const tbody = document.getElementById('autoMatrixBody');

      if (!selectedLine || !selectedModel) {
        tbody.innerHTML = '<tr><td style="padding:10px;">Vui lòng chọn Line và Model</td></tr>';
        return;
      }

      const filteredData = autoData.filter(d => d.line === selectedLine && d.model === selectedModel);

      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td style="padding:10px; color: var(--muted);">Chưa có máy nào. Nhấn nút thêm phía trên.</td></tr>';
        return;
      }

      let html = '';

      AUTO_FIELDS.forEach(field => {
        html += `<tr>`;
        html += `<td class="sticky-col">${field.label}</td>`;
        filteredData.forEach(item => {
          const inputClass = field.isHeader ? 'cell-input cell-input-header' : 'cell-input';
          const placeholder = field.isHeader ? 'Tên máy...' : '';
          html += `<td class="col-item">
            <textarea class="${inputClass}" placeholder="${placeholder}" oninput="autoResizeTextarea(this)" onchange="updateAutoItem(${item.id}, '${field.key}', this.value)">${item[field.key] || ''}</textarea>
          </td>`;
        });
        html += `</tr>`;
      });

      // Thao tác: Chèn giữa & Xóa
      html += `<tr>`;
      html += `<td class="sticky-col">Thao tác</td>`;
      filteredData.forEach(item => {
        html += `<td class="col-item">
          <button class="action-btn btn-insert" onclick="insertAutoColBefore(${item.id})">➕ Chèn máy trước</button>
          <button class="btn-danger action-btn" onclick="deleteAutoItem(${item.id})">🗑️ Xóa máy</button>
        </td>`;
      });
      html += `</tr>`;

      tbody.innerHTML = html;

      setTimeout(() => {
        document.querySelectorAll('#autoMatrixTable .cell-input').forEach(el => autoResizeTextarea(el));
      }, 0);
    }

    function addAutoCol() {
      const line = document.getElementById('autoLineSelect').value;
      const model = document.getElementById('autoModelSelect').value;
      if (!line || !model) { alert("Vui lòng chọn Line và Model!"); return; }

      autoData.push({
        id: Date.now(), line, model,
        may: 'Máy ' + (autoData.filter(d => d.line === line && d.model === model).length + 1),
        congDung: '', maOc1: '', soOc1: '', lucVit1: '',
        maOc2: '', soOc2: '', lucVit2: '', ghiChu: ''
      });
      saveData();
      renderAutoMatrix();
    }

    function insertAutoColBefore(targetId) {
      const targetIndex = autoData.findIndex(d => d.id === targetId);
      if (targetIndex === -1) return;

      const targetItem = autoData[targetIndex];
      const newItem = {
        id: Date.now(),
        line: targetItem.line,
        model: targetItem.model,
        may: 'Máy mới',
        congDung: '', maOc1: '', soOc1: '', lucVit1: '',
        maOc2: '', soOc2: '', lucVit2: '', ghiChu: ''
      };

      autoData.splice(targetIndex, 0, newItem);
      saveData();
      renderAutoMatrix();
    }

    function updateAutoItem(id, field, value) {
      const item = autoData.find(d => d.id === id);
      if (item) {
        item[field] = value;
        saveData();
      }
    }

    function deleteAutoItem(id) {
      if (confirm("Xóa máy này?")) {
        autoData = autoData.filter(d => d.id !== id);
        saveData();
        renderAutoMatrix();
      }
    }

    /* ===== TAB 2: HỌC ĐỒ GÁ ===== */
    const JIG_FIELDS = [
      { key: 'tram', label: 'Trạm', isHeader: true },
      { key: 'tenDoGa', label: 'Tên đồ gá' },
      { key: 'thongSo', label: 'Thông số' },
      { key: 'ghiChu', label: 'Ghi chú' }
    ];

    function renderJigMatrix() {
      const selectedLine = document.getElementById('jigLineSelect').value;
      const selectedModel = document.getElementById('jigModelSelect').value;
      const tbody = document.getElementById('jigMatrixBody');

      if (!selectedLine || !selectedModel) {
        tbody.innerHTML = '<tr><td style="padding:10px;">Vui lòng chọn Line và Model</td></tr>';
        return;
      }

      const filteredData = jigData.filter(d => d.line === selectedLine && d.model === selectedModel);

      if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td style="padding:10px; color: var(--muted);">Chưa có trạm nào. Nhấn nút thêm phía trên.</td></tr>';
        return;
      }

      let html = '';

      JIG_FIELDS.forEach(field => {
        html += `<tr>`;
        html += `<td class="sticky-col">${field.label}</td>`;
        filteredData.forEach(item => {
          const inputClass = field.isHeader ? 'cell-input cell-input-header' : 'cell-input';
          const placeholder = field.isHeader ? 'Tên trạm...' : '';
          html += `<td class="col-item">
            <textarea class="${inputClass}" placeholder="${placeholder}" oninput="autoResizeTextarea(this)" onchange="updateJigItem(${item.id}, '${field.key}', this.value)">${item[field.key] || ''}</textarea>
          </td>`;
        });
        html += `</tr>`;
      });

      html += `<tr>`;
      html += `<td class="sticky-col">Thao tác</td>`;
      filteredData.forEach(item => {
        html += `<td class="col-item">
          <button class="action-btn btn-insert" onclick="insertJigColBefore(${item.id})">➕ Chèn trạm trước</button>
          <button class="btn-danger action-btn" onclick="deleteJigItem(${item.id})">🗑️ Xóa trạm</button>
        </td>`;
      });
      html += `</tr>`;

      tbody.innerHTML = html;

      setTimeout(() => {
        document.querySelectorAll('#jigMatrixTable .cell-input').forEach(el => autoResizeTextarea(el));
      }, 0);
    }

    function addJigCol() {
      const line = document.getElementById('jigLineSelect').value;
      const model = document.getElementById('jigModelSelect').value;
      if (!line || !model) { alert("Vui lòng chọn Line và Model!"); return; }

      jigData.push({
        id: Date.now(), line, model,
        tram: 'Trạm ' + (jigData.filter(d => d.line === line && d.model === model).length + 1),
        tenDoGa: '', thongSo: '', ghiChu: ''
      });
      saveData();
      renderJigMatrix();
    }

    function insertJigColBefore(targetId) {
      const targetIndex = jigData.findIndex(d => d.id === targetId);
      if (targetIndex === -1) return;

      const targetItem = jigData[targetIndex];
      const newItem = {
        id: Date.now(),
        line: targetItem.line,
        model: targetItem.model,
        tram: 'Trạm mới',
        tenDoGa: '', thongSo: '', ghiChu: ''
      };

      jigData.splice(targetIndex, 0, newItem);
      saveData();
      renderJigMatrix();
    }

    function updateJigItem(id, field, value) {
      const item = jigData.find(d => d.id === id);
      if (item) {
        item[field] = value;
        saveData();
      }
    }

    function deleteJigItem(id) {
      if (confirm("Xóa trạm này?")) {
        jigData = jigData.filter(d => d.id !== id);
        saveData();
        renderJigMatrix();
      }
    }

    /* ===== TAB 3: CÀI ĐẶT ===== */
    function renderSettings() {
      const linesContainer = document.getElementById('linesListContainer');
      linesContainer.innerHTML = lines.map((l, index) => `
        <div class="list-item-manage">
          <span><b>Line:</b> ${l}</span>
          <button class="btn-danger action-btn" style="width:auto;" onclick="deleteLine(${index})">Xóa</button>
        </div>
      `).join('');

      const modelsContainer = document.getElementById('modelsListContainer');
      modelsContainer.innerHTML = models.map((m, index) => `
        <div class="list-item-manage">
          <span><b>Model:</b> ${m}</span>
          <button class="btn-danger action-btn" style="width:auto;" onclick="deleteModel(${index})">Xóa</button>
        </div>
      `).join('');
    }

    function addNewLine() {
      const val = document.getElementById('newLineInput').value.trim();
      if (!val) return;
      if (lines.includes(val)) { alert("Line này đã tồn tại!"); return; }

      lines.push(val);
      document.getElementById('newLineInput').value = '';
      saveData();
      updateSelectOptions();
      renderSettings();
    }

    function deleteLine(index) {
      if (confirm(`Xóa Line "${lines[index]}"?`)) {
        lines.splice(index, 1);
        saveData();
        updateSelectOptions();
        renderSettings();
      }
    }

    function addNewModel() {
      const val = document.getElementById('newModelInput').value.trim();
      if (!val) return;
      if (models.includes(val)) { alert("Model này đã tồn tại!"); return; }

      models.push(val);
      document.getElementById('newModelInput').value = '';
      saveData();
      updateSelectOptions();
      renderSettings();
    }

    function deleteModel(index) {
      if (confirm(`Xóa Model "${models[index]}"?`)) {
        models.splice(index, 1);
        saveData();
        updateSelectOptions();
        renderSettings();
      }
    }

    /* ===== XUẤT / NHẬP DỮ LIỆU ===== */
    function exportData() {
      const fullData = { lines, models, autoData, jigData };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Data_ThongSo_SX_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.lines) lines = parsed.lines;
          if (parsed.models) models = parsed.models;
          if (parsed.autoData) autoData = parsed.autoData;
          if (parsed.jigData) jigData = parsed.jigData;

          saveData();
          updateSelectOptions();
          alert("Phục hồi dữ liệu thành công!");
          location.reload();
        } catch (err) {
          alert("Lỗi file không hợp lệ!");
        }
      };
      reader.readAsText(file);
    }

    window.onload = function() {
      loadData();
      renderAutoMatrix();
    };
  </script>
</body>
